name: 'Bundle Addon'
description: 'Create a .mcpack or .mcaddon file from the repository contents'
inputs:
  pack-name:
    description: 'Name of the pack to create'
    required: true
  directory:
    description: 'Directory to include in the pack'
    required: true
    default: './*'

runs:
  using: 'composite'
  steps:
    - name: Warn about unmaintained version
      shell: bash
      run: echo '::warning::This v1 action is no longer maintained. See https://github.com/4mbl/bedrock-actions for maintained versions.'

    - name: Create pack from directory
      id: zip-pack
      run: |
        INITIAL=$(pwd)
        cd ${{ inputs.directory }}
        zip -r $INITIAL/${{ inputs.pack-name }} ./*
        cd $INITIAL
      shell: bash
