name: Build Actions and Sync Build Directory

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          install: true
          working-directory: ./pr-comment/

      - name: Build action
        run: pnpm run bundle
        working-directory: ./pr-comment/

      - name: Commit and Push Changes to Build
        if: github.event_name != 'pull_request'
        run: |
          echo "Committing changes to build directory"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          if [[ $(git status --porcelain .) ]]; then
          git add .
          git commit -m "build: update bundled actions"
          git push origin main
          else
          echo "No changes, skipping commit."
          fi
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
